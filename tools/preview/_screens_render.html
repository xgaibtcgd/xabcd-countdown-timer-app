<meta charset="utf-8">
<style>
/* The real bundled faces, not Google's copies: this harness is checking metrics. */
@font-face { font-family: "Nunito"; font-weight: 400;
             src: url("../../app/src/main/res/font/mm_round.ttf") format("truetype"); }
@font-face { font-family: "Nunito"; font-weight: 800;
             src: url("../../app/src/main/res/font/mm_round_bold.ttf") format("truetype"); }
@font-face { font-family: "Baloo 2"; font-weight: 800;
             src: url("../../app/src/main/res/font/mm_display.ttf") format("truetype"); }
</style>
<body style="margin:0;background:#222">
<script src="data.js"></script>
<script src="screens-engine.js"></script>
<script src="screens-draw.js"></script>
<script src="screens-ui.js"></script>
<script>
/* The real page owns image loading; this harness reproduces just that part. */
/* Taken from the export, not typed out again: the hand-written copy of this list
   was still seven long when the eighth character shipped, so the trike drew with
   no sprite and no backdrop and the preview quietly lied about it. */
const KEYS = DATA.buddies.map(b => b.key);
const BUDDY_IMAGES = [];
const BACKDROPS = { home: null, adventure: [] };
window.READY = new Promise(resolve => {
  let pending = KEYS.length * 2 + 1;
  const done = () => { if (--pending === 0) resolve(true); };
  KEYS.forEach((key, i) => {
    const b = new Image(); b.onload = b.onerror = done;
    b.src = 'buddies/' + key + '.png'; BUDDY_IMAGES[i] = b;
    const s = new Image(); s.onload = s.onerror = done;
    s.src = 'backdrops/adventure_' + key + '.jpg'; BACKDROPS.adventure[i] = s;
  });
  const h = new Image(); h.onload = h.onerror = done;
  h.src = 'backdrops/home_storybook.jpg'; BACKDROPS.home = h;
});

window.RENDER = (screenKey, buddyIndex, deviceIndex, t) => {
  const screen = SCREENS.find(s => s.key === screenKey);
  const device = DATA.devices[deviceIndex];
  const L = device.layout;
  const buddy = DATA.buddies[buddyIndex];
  const c = document.createElement('canvas');
  c.width = DATA.metrics.designWidth;
  c.height = Math.round(L.height);
  c.id = 'out';
  document.body.innerHTML = '';
  document.body.appendChild(c);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#E8F8FF';
  ctx.fillRect(0, 0, c.width, c.height);
  screen.draw(ctx, L, buddy, t);
  return true;
};
</script>
</body>
